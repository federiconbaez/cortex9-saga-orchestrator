[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cortex9-saga-orchestrator"
version = "0.1.0"
description = "Event-sourced saga orchestrator with compensations, pivots, retries, timeouts and idempotency keys (hexagonal)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Federico Nicolas Baez Rizzo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/cortex9_saga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["cortex9_saga"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S311", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["cortex9_saga"]
known-local-folder = ["support", "conftest"]
